# TLS Secret for Production Environment
# This is a template with placeholder values.
# 
# To generate a real self-signed certificate:
#   cd k8s/ingress
#   chmod +x 01-generate-self-signed-cert.sh
#   ./01-generate-self-signed-cert.sh prod api.example.com
#
# For production, use Let's Encrypt with cert-manager or Azure Key Vault
#
# Apply: kubectl apply -f k8s/ingress/02-tls-secret-prod.yaml

apiVersion: v1
kind: Secret
metadata:
  name: tls-secret-prod
  namespace: prod
  labels:
    environment: production
    managed-by: jenkins
type: kubernetes.io/tls
data:
  # Replace with base64 encoded certificate and key
  # Generate using: ./01-generate-self-signed-cert.sh prod
  tls.key: <BASE64_ENCODED_KEY>
  tls.crt: <BASE64_ENCODED_CERT>

