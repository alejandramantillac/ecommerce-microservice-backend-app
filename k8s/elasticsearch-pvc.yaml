# PersistentVolumeClaim for Elasticsearch
# Provides persistent storage for Elasticsearch data
# Apply: kubectl apply -f k8s/elasticsearch-pvc.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: ${NAMESPACE}
  labels:
    app: elasticsearch
    component: logging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi  # Optimized storage
  # storageClassName: standard  # Uncomment and specify if using specific storage class

