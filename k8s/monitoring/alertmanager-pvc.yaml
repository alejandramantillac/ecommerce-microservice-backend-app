# PersistentVolumeClaim for Alertmanager
# Provides persistent storage for Alertmanager state and silences
# Apply: kubectl apply -f k8s/alertmanager-pvc.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: ${NAMESPACE}
  labels:
    app: alertmanager
    component: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # storageClassName: standard  # Uncomment and specify if using specific storage class

