# Prometheus Configuration con remote_write a Azure Monitor Workspace
# Este ConfigMap reemplaza al prometheus-configmap.yaml original
# Apply: kubectl apply -f k8s/monitoring/prometheus-config-remote-write.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ${NAMESPACE}
  labels:
    app: prometheus-agent
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
      evaluation_interval: 30s
      external_labels:
        cluster: 'ecommerce-microservices'
        environment: '${ENVIRONMENT}'

    # Remote write a Azure Monitor Workspace
    remote_write:
      - url: '${AZURE_PROMETHEUS_INGESTION_ENDPOINT}/api/v1/write'
        write_relabel_configs:
          - source_labels: [__name__]
            regex: '.*'
            action: keep
        queue_config:
          max_samples_per_send: 1000
          batch_send_deadline: 5s
          max_shards: 200
          min_shards: 1
        # Autenticación OAuth2 con Azure AD
        oauth2:
          client_id: '${AZURE_CLIENT_ID}'
          client_secret: '${AZURE_CLIENT_SECRET}'
          token_url: 'https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token'
          scopes:
            - 'https://monitor.azure.com/.default'

    # Scrape configurations
    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus-agent'
        static_configs:
          - targets: ['localhost:9090']
        metrics_path: '/metrics'

      # API Gateway
      - job_name: 'api-gateway'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: api-gateway
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'api-gateway.${NAMESPACE}.svc.cluster.local:8080'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # User Service
      - job_name: 'user-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: user-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'user-service.${NAMESPACE}.svc.cluster.local:8700'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Product Service
      - job_name: 'product-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: product-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'product-service.${NAMESPACE}.svc.cluster.local:8500'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Order Service
      - job_name: 'order-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: order-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'order-service.${NAMESPACE}.svc.cluster.local:8300'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Payment Service
      - job_name: 'payment-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: payment-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'payment-service.${NAMESPACE}.svc.cluster.local:8800'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Shipping Service
      - job_name: 'shipping-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: shipping-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'shipping-service.${NAMESPACE}.svc.cluster.local:8600'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Favourite Service
      - job_name: 'favourite-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: favourite-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'favourite-service.${NAMESPACE}.svc.cluster.local:8400'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Proxy Client
      - job_name: 'proxy-client'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: proxy-client
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'proxy-client.${NAMESPACE}.svc.cluster.local:8900'
        metrics_path: '/app/actuator/prometheus'
        scrape_interval: 15s

      # Service Discovery (Eureka)
      - job_name: 'service-discovery'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: service-discovery
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'service-discovery.${NAMESPACE}.svc.cluster.local:8761'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Kubernetes Pods (para métricas de pods con anotaciones)
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

