# Prometheus Configuration
# This ConfigMap contains the Prometheus server configuration
# Apply: kubectl apply -f k8s/prometheus-configmap.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ${NAMESPACE}
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s      # Scrape targets every 15 seconds
      scrape_timeout: 10s       # Timeout for scraping
      evaluation_interval: 15s  # Evaluate rules every 15 seconds
      external_labels:
        cluster: 'ecommerce-microservices'
        environment: '${ENVIRONMENT}'

    # Alertmanager configuration (will be configured in Phase 4)
    # alerting:
    #   alertmanagers:
    #     - static_configs:
    #         - targets:
    #           - alertmanager:9093

    # Load rules once and periodically evaluate them (will be configured in Phase 4)
    # rule_files:
    #   - "/etc/prometheus/rules/*.yml"

    # Scrape configurations
    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        metrics_path: '/metrics'

      # API Gateway
      - job_name: 'api-gateway'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: api-gateway
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'api-gateway.${NAMESPACE}.svc.cluster.local:8080'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # User Service
      - job_name: 'user-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: user-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'user-service.${NAMESPACE}.svc.cluster.local:8700'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Product Service
      - job_name: 'product-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: product-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'product-service.${NAMESPACE}.svc.cluster.local:8500'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Order Service
      - job_name: 'order-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: order-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'order-service.${NAMESPACE}.svc.cluster.local:8300'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Payment Service
      - job_name: 'payment-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: payment-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'payment-service.${NAMESPACE}.svc.cluster.local:8800'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Shipping Service
      - job_name: 'shipping-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: shipping-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'shipping-service.${NAMESPACE}.svc.cluster.local:8600'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Favourite Service
      - job_name: 'favourite-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: favourite-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'favourite-service.${NAMESPACE}.svc.cluster.local:8400'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Proxy Client
      - job_name: 'proxy-client'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: proxy-client
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'proxy-client.${NAMESPACE}.svc.cluster.local:8900'
        metrics_path: '/app/actuator/prometheus'
        scrape_interval: 15s

      # Service Discovery (Eureka)
      - job_name: 'service-discovery'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${NAMESPACE}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: service-discovery
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: __address__
            replacement: 'service-discovery.${NAMESPACE}.svc.cluster.local:8761'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s

      # Kubernetes API Server (optional - for cluster metrics)
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes Nodes (optional - for node metrics)
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubernetes Pods (optional - for pod metrics)
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name



