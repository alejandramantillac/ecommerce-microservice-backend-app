# Kubernetes Secret for Staging Environment
# IMPORTANT: This is a template. You must generate the actual secret with a secure key.
# 
# To generate this secret:
#   1. Generate a secure random key: openssl rand -base64 32
#   2. Encode it: echo -n 'your-secret-key' | base64
#   3. Replace <BASE64_ENCODED_SECRET> below with the encoded value
#
# Apply: kubectl apply -f k8s/base/secrets/03-secret-staging.yaml

apiVersion: v1
kind: Secret
metadata:
  name: micro-secrets
  namespace: staging
  labels:
    environment: staging
    managed-by: jenkins
type: Opaque
data:
  # JWT Secret Key (base64 encoded)
  # Generate with: echo -n 'your-secure-random-key' | base64
  JWT_SECRET_KEY: <BASE64_ENCODED_SECRET>

