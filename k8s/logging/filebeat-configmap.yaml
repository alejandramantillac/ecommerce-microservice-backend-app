# Filebeat Configuration
# Configures Filebeat to collect logs from Kubernetes pods
# Apply: kubectl apply -f k8s/filebeat-configmap.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: ${NAMESPACE}
  labels:
    app: filebeat
    component: logging
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*.log
    
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
          - logs_path:
              logs_path: "/var/log/containers/"
          default_indexers:
            - container
          default_matchers:
            - fields
            - format1
            - format2
      
      - add_fields:
          target: ""
          fields:
            cluster: "ecommerce-microservices"
            environment: "${ENVIRONMENT}"
    
    output.azure_loganalytics:
      workspace_id: "${LOG_ANALYTICS_WORKSPACE_ID}"
      customer_id: "${LOG_ANALYTICS_CUSTOMER_ID}"
      shared_key: "${LOG_ANALYTICS_SHARED_KEY}"
      log_type: "Filebeat"
      fields_under_root: true
      fields:
        cluster: "ecommerce-microservices"
        environment: "${ENVIRONMENT}"
    
    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat
      keepfiles: 7
      permissions: 0644
