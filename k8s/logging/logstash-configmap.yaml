# Logstash Configuration
# Configures Logstash pipeline for processing logs
# Apply: kubectl apply -f k8s/logstash-configmap.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: ${NAMESPACE}
  labels:
    app: logstash
    component: logging
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.elasticsearch.hosts: ["http://elasticsearch:9200"]
    xpack.monitoring.enabled: true
    
  pipelines.yml: |
    - pipeline.id: main
      path.config: "/usr/share/logstash/pipeline/logstash.conf"
      
  logstash.conf: |
    input {
      # Beats input for receiving logs from Filebeat
      beats {
        port => 5044
      }
      
      # HTTP input for direct log ingestion (optional)
      http {
        port => 8080
        codec => json
      }
    }
    
    filter {
      # Parse JSON logs if they come as JSON
      if [message] =~ /^\{/ {
        json {
          source => "message"
        }
      }
      
      # Parse Spring Boot logs with pattern: "yyyy-MM-dd HH:mm:ss - message"
      if [message] =~ /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/ {
        grok {
          match => {
            "message" => "(?<log_timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) - (?<log_message>.*)"
          }
          overwrite => [ "message" ]
        }
        
        # Parse timestamp
        date {
          match => [ "log_timestamp", "yyyy-MM-dd HH:mm:ss" ]
          target => "@timestamp"
        }
        
        # Extract log level (simplified)
        if [log_message] =~ /(?i)\b(ERROR|WARN|DEBUG|INFO|TRACE)\b/ {
          grok {
            match => {
              "log_message" => "(?i).*\b(?<log_level>ERROR|WARN|DEBUG|INFO|TRACE)\b.*"
            }
          }
        } else {
          mutate {
            add_field => { "log_level" => "INFO" }
          }
        }
        
        # Extract service from Kubernetes metadata (Filebeat adds this)
        if [kubernetes][labels][app] {
          mutate {
            add_field => { "service" => "%{[kubernetes][labels][app]}" }
          }
        }
        
        # Extract trace-id and span-id (Spring Cloud Sleuth)
        grok {
          match => {
            "log_message" => ".*\[(?<trace_id>[a-f0-9-]{36})\].*\[(?<span_id>[a-f0-9]{16})\].*"
          }
        }
        
        # Clean up
        mutate {
          rename => { "log_message" => "message" }
          remove_field => [ "log_timestamp" ]
        }
      }
      
      # Add common fields
      mutate {
        add_field => { 
          "environment" => "${ENVIRONMENT}"
          "cluster" => "ecommerce-microservices"
        }
      }
    }
    
    output {
      # Send to Elasticsearch with index per service
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "%{[service]}-logs-%{+YYYY.MM.dd}"
        template_name => "logstash"
        template => "/usr/share/logstash/templates/logstash-template.json"
        template_overwrite => true
      }
      
      # Fallback to default index if service not found
      if ![service] {
        elasticsearch {
          hosts => ["http://elasticsearch:9200"]
          index => "logstash-logs-%{+YYYY.MM.dd}"
        }
      }
      
      # Debug output (can be removed in production)
      # stdout {
      #   codec => rubydebug
      # }
    }

