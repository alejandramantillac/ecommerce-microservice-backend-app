
server:
  servlet:
    context-path: /app

spring:
  zipkin:
    base-url: ${SPRING_ZIPKIN_BASE_URL:http://localhost:9411/}
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:9296}
  application:
    name: PROXY-CLIENT
  profiles:
    active:
    - dev

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      proxyService:
        register-health-indicator: true
        event-consumer-buffer-size: 10
        automatic-transition-from-open-to-half-open-enabled: true
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
        sliding-window-type: COUNT_BASED
  bulkhead:
    instances:
      paymentClientService:
        max-concurrent-calls: 10
        max-wait-duration: 2s
      orderClientService:
        max-concurrent-calls: 10
        max-wait-duration: 2s
      productClientService:
        max-concurrent-calls: 20
        max-wait-duration: 1s
      userClientService:
        max-concurrent-calls: 20
        max-wait-duration: 1s

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

management:
  health:
    circuitbreakers:
      enabled: true
    bulkheads:
      enabled: true
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Feature Toggle Configuration
# Features can be enabled/disabled dynamically through Spring Cloud Config
# Use @RefreshScope to update without restart: POST /actuator/refresh
feature:
  toggle:
    new-payment-method: ${FEATURE_TOGGLE_NEW_PAYMENT_METHOD:true}
    advanced-search: ${FEATURE_TOGGLE_ADVANCED_SEARCH:false}
    recommendation-engine: ${FEATURE_TOGGLE_RECOMMENDATION_ENGINE:false}
    bulk-operations: ${FEATURE_TOGGLE_BULK_OPERATIONS:true}







