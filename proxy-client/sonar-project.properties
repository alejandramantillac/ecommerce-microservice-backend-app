# SonarQube Project Configuration for proxy-client
sonar.projectKey=ecommerce-microservice-backend:proxy-client
sonar.projectName=proxy-client
sonar.projectVersion=0.1.0

# Source code
sonar.sources=src/main
sonar.tests=src/test
sonar.sourceEncoding=UTF-8

# Language
sonar.language=java
sonar.java.source=11
sonar.java.target=11

# Exclusions
sonar.exclusions=**/target/**,**/*.jar,**/*.class,**/generated-sources/**,**/generated-test-sources/**
sonar.test.exclusions=**/target/**,**/generated-test-sources/**
sonar.coverage.exclusions=**/target/**,**/*.jar,**/*.class

# Module-specific settings
sonar.moduleKey=proxy-client

